services:
  postgres:
    image: postgres:16-alpine
    container_name: mordida-tasty-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: mordida
      POSTGRES_PASSWORD: mordida_local_password
      POSTGRES_DB: mordida_tasty
    volumes:
      - mordida_tasty_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mordida -d mordida_tasty']
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:latest
    container_name: mordida-tasty-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  mordida_tasty_pgdata:
